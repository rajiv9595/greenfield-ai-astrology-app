name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Live ephemeris verification (audit finding E1): provisions the exact
  # pinned upstream Swiss Ephemeris revision and verified ephemeris data,
  # then runs the full suite with SWEPH_BIN/SWEPH_EPHE_PATH set so the 17
  # live-gated tests execute instead of skipping. Kept as a separate job
  # so offline and live failures diagnose independently. The offline
  # fail-closed behavior for missing assets is unchanged and still
  # covered by the offline job above.
  live-ephemeris:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export live ephemeris paths
        run: |
          echo "SWEPH_BIN=$RUNNER_TEMP/sweph-checkout/swetest" >> "$GITHUB_ENV"
          echo "SWEPH_EPHE_PATH=$RUNNER_TEMP/sweph-checkout/ephe" >> "$GITHUB_ENV"
      - name: Check pinned revision matches build-info.ts
        run: |
          script_sha="$(grep -oE '[0-9a-f]{40}' scripts/provision-sweph.sh | head -n 1)"
          script_version="$(grep -oE 'EXPECTED_VERSION="[0-9.]+"' scripts/provision-sweph.sh | head -n 1 | grep -oE '[0-9.]+')"
          grep -qF "$script_sha" packages/swiss-ephemeris/src/build-info.ts
          grep -qF "$script_version" packages/swiss-ephemeris/src/build-info.ts
          echo "pinned revision $script_sha (library $script_version) matches build-info.ts"
      - name: Provision and verify pinned Swiss Ephemeris
        run: bash scripts/provision-sweph.sh "$RUNNER_TEMP/sweph-checkout" "packages/swiss-ephemeris/ephe-sha256.txt"
      - name: Run full suite with live ephemeris
        run: npm test -- --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/live-test-output.txt"
      - name: Assert live suites executed with no skips
        run: |
          sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/live-test-output.txt" > "$RUNNER_TEMP/live-test-clean.txt"
          # Parses one Vitest summary line ("Tests  69 passed (69)",
          # "Tests  52 passed | 17 skipped (69)") from a file and fails
          # unless every collected test passed with none skipped or
          # failed. Only summary fields are inspected, so test names
          # containing "skip" can never trip the gate. Missing or
          # unrecognized summaries fail closed. Usage:
          # assert_summary <"Test Files"|"Tests "> <file>.
          assert_summary() {
            local summary total passed skipped failed
            summary="$(grep -E "$1 +[0-9]+" "$2" | tail -n 1)"
            if [ -z "$summary" ]; then
              echo "missing $1 summary; failing" >&2
              return 1
            fi
            total="$(echo "$summary" | grep -oE '\([0-9]+\)' | grep -oE '[0-9]+' || true)"
            passed="$(echo "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -n 1 || true)"
            if [ -z "$total" ] || [ -z "$passed" ]; then
              echo "unrecognized $1 summary: $summary" >&2
              return 1
            fi
            skipped="$(echo "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' | head -n 1 || true)"
            failed="$(echo "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' | head -n 1 || true)"
            skipped="${skipped:-0}"
            failed="${failed:-0}"
            if [ "$passed" != "$total" ] || [ "$skipped" != "0" ] || [ "$failed" != "0" ]; then
              echo "not clean: $summary" >&2
              return 1
            fi
            echo "clean summary: $summary"
          }
          # Self-test the gate against synthetic summaries before trusting
          # it on the real output. gate_case <name> <want-exit> <content>.
          gate_case() {
            local name="$1" want="$2" content="$3"
            local casefile="$RUNNER_TEMP/gate-case.txt"
            printf '%s\n' "$content" > "$casefile"
            local got=0
            assert_summary "Tests " "$casefile" >/dev/null 2>&1 || got=1
            if [ "$got" != "$want" ]; then
              echo "gate self-test FAILED: $name (want exit $want, got $got)" >&2
              return 1
            fi
            echo "gate self-test ok: $name"
          }
          gate_case "valid live output" 0 "Tests  69 passed (69)"
          gate_case "skipped tests" 1 "Tests  52 passed | 17 skipped (69)"
          gate_case "failed tests" 1 "Tests  1 failed | 68 passed (69)"
          gate_case "missing summary" 1 ""
          gate_case "malformed summary" 1 "Tests completed with errors"
          gate_case "skip in test name only" 0 "✓ skips nothing here  12ms
          Tests  3 passed (3)"
          # Exercise the direct-call path (errexit active, as in the real
          # check below): a valid summary must succeed here too, not only
          # inside the guarded self-test calls above.
          printf '%s\n' "Test Files  8 passed (8)" > "$RUNNER_TEMP/gate-direct.txt"
          assert_summary "Test Files" "$RUNNER_TEMP/gate-direct.txt" >/dev/null
          echo "gate self-test ok: direct call on valid summary"
          # Real check on the live run output.
          assert_summary "Test Files" "$RUNNER_TEMP/live-test-clean.txt"
          assert_summary "Tests " "$RUNNER_TEMP/live-test-clean.txt"
          echo "all collected tests passed with no skips; live verification enforced"
